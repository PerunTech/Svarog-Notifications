stages:
  - 1_linter
  - 2_build_and_install
  - 3_mvn_install

before_script:
  - pwd
  - echo $CI_BUILD_REF_NAME
  - git remote -v
  - git reset --hard HEAD
  - git stash
  - git pull origin $CI_BUILD_REF_NAME

after_script:
  - git reset --hard HEAD
  - git stash
  - git pull origin $CI_BUILD_REF_NAME

1_pnpm_install_test_build:
  stage: 1_linter
  script:
    - pwd
    - git reset --hard HEAD
    # vite's and oxlint's native bindings are optional dependencies, which pnpm skips without a word on an older node.
    - |
      floor=$(node -p "require('./package.json').engines.node.replace(/[^0-9.]/g,'')")
      have=$(node -p "process.versions.node")
      if [ "$(printf '%s\n%s\n' "$floor" "$have" | sort -V | head -1)" != "$floor" ]; then
        echo "This runner has node $have; this package needs $floor or newer."
        exit 1
      fi
    - rm -rf node_modules
    - pnpm install
    - pnpm run lint
    - pnpm run build

1_build_test_java:
  stage: 2_build_and_install
  script:
    - cd backend
    - mvn clean
    - mvn test

1_svarog-nofitications-install:
  stage: 3_mvn_install
  script:
    - pwd
    - cd $CI_PROJECT_DIR/
    - git reset --hard HEAD
    - rm -rf node_modules
    - pnpm install
    - rm -rf backend/www/*.js
    - pnpm run build
    - cd backend
    - ls -al www/
    - pwd
    - mvn clean compile deploy -DskipTests
  only:
    - dev
    - main
